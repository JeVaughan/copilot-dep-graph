<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dependency Graph</title>
  <script src="/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden;
      background: var(--background-color-default, #0d1117);
      color: var(--text-color-default, #e6edf3);
      font-family: var(--font-sans, sans-serif); font-size: 14px; }
    #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--background-color-subtle, #161b22);
      border-bottom: 1px solid var(--border-color-default, #30363d); flex-shrink: 0; }
    #toolbar h1 { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button { background: var(--background-color-subtle, #161b22); color: var(--text-color-default, #e6edf3);
      border: 1px solid var(--border-color-default, #30363d); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
    button:hover { background: var(--background-color-emphasis, #21262d); }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; }
    /* Edge type (import / call / sibling) is not shown visually — hover an edge for that. */
    .link { stroke: #8b949e; stroke-opacity: 0.45; stroke-width: 1.2; cursor: default; }
    .link.added    { stroke: #56d364; stroke-opacity: 0.35; }
    .link.modified { stroke: #e3b341; stroke-opacity: 0.35; }
    .link.removed  { stroke: #f85149; stroke-opacity: 0.30; stroke-dasharray: 5,3; }
    .node circle { cursor: default; }
    .node.expandable circle { cursor: pointer; }
    .label { pointer-events: none; dominant-baseline: central; }
    .label.file { fill: #e6edf3; font-size: 11px; font-weight: 500; }
    .label.symbol { fill: #adbac7; font-size: 10px; }
    #tooltip { position: absolute; pointer-events: none;
      background: var(--background-color-subtle, #161b22);
      border: 1px solid var(--border-color-default, #30363d);
      border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 300px;
      opacity: 0; transition: opacity 0.1s; z-index: 10; }
    #tooltip.visible { opacity: 1; }
    #tooltip strong { display: block; margin-bottom: 4px; word-break: break-all; }
    #tooltip .meta { color: #7d8590; font-size: 11px; }
    #empty { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
      color: #7d8590; padding: 1rem; text-align: center; }
    #empty.show { display: flex; }
    #app { display: flex; flex-direction: column; height: 100vh; }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1 id="graph-title">Dependency Graph</h1>
    <button id="btn-fit">Fit</button>
    <button id="btn-reset-expand">Collapse all</button>
    <span style="flex:1"></span>
    <span style="display:flex;align-items:center;gap:10px;font-size:11px;color:#7d8590">
      <span style="color:#56d364;font-weight:600">+ added</span>
      <span style="color:#e3b341;font-weight:600">~ modified</span>
      <span style="color:#f85149;font-weight:600">- removed</span>
      <span style="color:#adbac7">&#9650; fn/method</span>
      <span style="color:#adbac7">&#9632; class/type</span>
      <span style="color:#adbac7">&#9679; prop/const</span>
    </span>
  </div>
  <div id="canvas-wrap">
    <svg id="svg"><g id="root"></g></svg>
    <div id="tooltip"></div>
    <div id="empty" class="show"><span id="empty-msg">No graph loaded.</span></div>
  </div>
</div>
<script src="/graph-client.js"></script>
</body>
</html>
